<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="12" opacity="0.3" filter="url(#glow)" />

  <!-- Home Roof / Finance Crest -->
  <path d="M 140 240 L 256 140 L 372 240" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- House Body / Vault Outline -->
  <rect x="170" y="240" width="172" height="150" rx="24" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="18" />

  <!-- Dollar & Growth Arrow Emblem -->
  <circle cx="256" cy="315" r="46" fill="url(#primaryGrad)" />
  <text x="256" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#022c22" text-anchor="middle">$</text>

  <!-- Mini Sparkle / Star of Quality -->
  <path d="M 370 150 L 377 168 L 395 175 L 377 182 L 370 200 L 363 182 L 345 175 L 363 168 Z" fill="#fbbf24" />
</svg>
